<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>社員ログイン</title>
<link rel="stylesheet" href="css/style.css">
<style>
body { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); }
.login-card {
  background: white; border-radius: 20px; padding: 36px 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  width: 100%; max-width: 360px;
}
.field { margin-bottom: 16px; text-align: left; }
.field label { display:block; font-size:13px; font-weight:600; color:#334155; margin-bottom:6px; }
.field input {
  width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 16px;
  border: 1.5px solid #cbd5e1; border-radius: 10px; outline: none;
}
.field input:focus { border-color:#1e40af; }
.btn-login {
  width: 100%; padding: 13px; font-size: 16px; font-weight: 700; color: white;
  background: #1e40af; border: none; border-radius: 10px; cursor: pointer; margin-top: 4px;
}
.btn-login:disabled { opacity:.6; cursor:default; }
</style>
</head>
<body>
<div class="full-center">
  <div class="login-card">
    <div class="text-center" style="margin-bottom:24px;">
      <div style="font-size:40px;margin-bottom:8px;">🔐</div>
      <div style="font-size:20px;font-weight:700;color:#1e40af;">社員ログイン</div>
    </div>

    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <div id="error-msg" style="display:none;text-align:center;color:#dc2626;font-size:13px;margin:4px 0 12px;"></div>

      <button type="submit" class="btn-login" id="btn-login">ログイン</button>
    </form>

    <div style="margin-top:20px;text-align:center;">
      <a href="index.html" style="font-size:13px;color:#64748b;">← トップに戻る</a>
    </div>
  </div>
</div>

<div id="page-loading" style="display:none;position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:9998;align-items:center;justify-content:center;"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
function init() {
  if (Auth.isLoggedIn()) { redirectAfterLogin(); }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = '';
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) return;

  document.getElementById('error-msg').style.display = 'none';
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  App.loading(true);
  const result = await Auth.login(email, password);
  App.loading(false);
  btn.disabled = false;

  if (result.ok) {
    redirectAfterLogin();
  } else {
    showError(result.error || 'ログインに失敗しました');
  }
});

function redirectAfterLogin() {
  const params = new URLSearchParams(location.search);
  const next = params.get('next');
  if (next && next.startsWith(location.origin)) {
    location.href = next;
  } else {
    location.href = 'list.html';
  }
}

init();
</script>
</body>
</html>
