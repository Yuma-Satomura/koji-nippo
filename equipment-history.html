<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>点検履歴</title>
<link rel="stylesheet" href="css/style.css">
<style>
.h-wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
.eq-head { background:linear-gradient(135deg,#1e3a8a,#1e40af); color:#fff; border-radius:14px; padding:16px; margin-bottom:16px; }
.eq-head .n { font-size:18px; font-weight:800; }
.eq-head .k { font-size:12px; opacity:.85; margin-top:2px; }
.rec { background:#fff; border:1px solid #e2e8f0; border-radius:12px; margin-bottom:10px; overflow:hidden; }
.rec-head { display:flex; align-items:center; justify-content:space-between; padding:13px 15px; cursor:pointer; }
.rec-date { font-weight:700; }
.rec-sub { font-size:12px; color:#64748b; margin-top:2px; }
.badge { font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; }
.b-ok { background:#dcfce7; color:#15803d; }
.b-ng { background:#fee2e2; color:#b91c1c; }
.flag { font-size:11px; color:#b45309; margin-left:6px; }
.detail { display:none; border-top:1px solid #f1f5f9; padding:12px 15px; }
.d-group { font-weight:700; color:#1e40af; font-size:13px; margin:10px 0 4px; }
.d-group:first-child { margin-top:0; }
.d-item { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px solid #f8fafc; }
.d-item .r-good { color:#15803d; } .d-item .r-warn { color:#a16207; font-weight:700; } .d-item .r-bad { color:#b91c1c; font-weight:700; }
.d-memo { margin-top:10px; font-size:13px; background:#f8fafc; border-radius:8px; padding:8px 10px; white-space:pre-wrap; }
.empty { text-align:center; color:#94a3b8; padding:28px; font-size:14px; }
</style>
</head>
<body>
<div class="app-header">
  <div class="header-inner">
    <a href="equipment.html" class="btn btn-ghost btn-sm">← 機械一覧</a>
    <div class="header-title">点検履歴</div>
    <span style="width:70px;"></span>
  </div>
</div>

<div class="h-wrap">
  <div class="eq-head">
    <div class="n" id="eq-name">—</div>
    <div class="k" id="eq-kind"></div>
  </div>
  <div id="list"><div class="empty">読み込み中…</div></div>
</div>

<div id="page-loading" style="display:none;position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:9998;align-items:center;justify-content:center;"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
if (!Auth.requireAuth()) { /* redirect */ }
const eqId = new URLSearchParams(location.search).get('eq');

async function init() {
  if (!eqId) { document.getElementById('list').innerHTML = '<div class="empty">機械が指定されていません</div>'; return; }
  App.loading(true);
  try {
    const eq = await Storage.getEquipmentItem(eqId);
    if (eq) {
      document.getElementById('eq-name').textContent = eq.name;
      document.getElementById('eq-kind').textContent = (eq.kind || '') + (eq.site_number ? ' ・ 現場 ' + eq.site_number : '');
    }
    const rows = await Storage.getInspections(eqId);
    render(rows);
  } catch (e) { App.handleError(e, '読み込みに失敗しました'); }
  finally { App.loading(false); }
}

function render(rows) {
  const el = document.getElementById('list');
  if (!rows.length) { el.innerHTML = '<div class="empty">まだ点検記録がありません</div>'; return; }
  el.innerHTML = rows.map((row, i) => {
    const d = row.data || {};
    const items = d.items || {};
    const entries = Object.entries(items);
    const bad = entries.filter(([, v]) => v === '不良').length;
    const warn = entries.filter(([, v]) => v === '要修理').length;
    const ok = d.overall === '使用可';
    const flags = [];
    if (bad) flags.push('不良' + bad);
    if (warn) flags.push('要修理' + warn);
    return `
      <div class="rec">
        <div class="rec-head" onclick="toggle(${i})">
          <div>
            <div class="rec-date">${App.escHtml(row.date)}<span class="flag">${flags.join('・')}</span></div>
            <div class="rec-sub">点検者：${App.escHtml(d.inspector || row.inspector || '—')}</div>
          </div>
          <span class="badge ${ok ? 'b-ok' : 'b-ng'}">${App.escHtml(d.overall || '—')}</span>
        </div>
        <div class="detail" id="detail-${i}">
          ${renderDetail(items, d.memo)}
        </div>
      </div>`;
  }).join('');
}

function renderDetail(items, memo) {
  const entries = Object.entries(items);
  if (!entries.length) return '<div class="rec-sub">項目データがありません</div>';
  let html = entries.map(([label, v]) => {
    const cls = v === '異常なし' ? 'r-good' : v === '要修理' ? 'r-warn' : 'r-bad';
    return `<div class="d-item"><span>${App.escHtml(label)}</span><span class="${cls}">${App.escHtml(v)}</span></div>`;
  }).join('');
  if (memo) html += `<div class="d-memo">特記：${App.escHtml(memo)}</div>`;
  return html;
}

function toggle(i) {
  const el = document.getElementById('detail-' + i);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

init();
</script>
</body>
</html>
