<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KY 編集</title>
<link rel="stylesheet" href="css/style.css">
<style>
.ky-wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
.card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:16px; margin-bottom:14px; }
.card h2 { font-size:14px; color:#1e40af; margin:0 0 12px; }
.field { margin-bottom:12px; }
.field:last-child { margin-bottom:0; }
.field label { display:block; font-size:13px; font-weight:600; color:#334155; margin-bottom:5px; }
.field input, .field textarea, .field select { width:100%; box-sizing:border-box; padding:10px 12px; font-size:15px; border:1.5px solid #cbd5e1; border-radius:9px; }
.field textarea { resize:vertical; }
.hz { border:1px solid #e2e8f0; border-radius:10px; padding:12px; margin-bottom:10px; }
.hz-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.hz-no { font-weight:800; color:#1e40af; }
.ps-row { display:flex; gap:8px; align-items:flex-end; }
.ps-row .field { flex:1; margin-bottom:0; }
.risk-badge { font-size:12px; font-weight:800; padding:4px 10px; border-radius:8px; white-space:nowrap; align-self:center; margin-top:18px; }
.r1,.r2 { background:#dcfce7; color:#15803d; } .r3 { background:#fef9c3; color:#a16207; } .r4,.r5 { background:#fee2e2; color:#b91c1c; } .r0 { background:#f1f5f9; color:#94a3b8; }
.q-row { display:flex; gap:8px; margin-bottom:8px; }
.q-row .field { flex:1; margin-bottom:0; }
.worker { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.worker input { flex:1; }
.sig-prev { width:120px; height:46px; border:1px solid #e2e8f0; border-radius:6px; object-fit:contain; background:#fff; }
.sig-ph { width:120px; height:46px; border:1px dashed #cbd5e1; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#94a3b8; }
.addbtn { background:none; border:1px dashed #94a3b8; border-radius:9px; padding:9px; width:100%; color:#1e40af; font-weight:600; cursor:pointer; font-size:14px; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:9999; padding:16px; }
.modal-box { background:#fff; border-radius:14px; padding:18px; max-width:420px; width:100%; }
#sig-canvas { width:100%; height:200px; border:1.5px solid #cbd5e1; border-radius:9px; touch-action:none; }
.hint { font-size:11px; color:#64748b; margin-top:4px; }
</style>
</head>
<body>
<div class="app-header">
  <div class="header-inner">
    <a href="ky.html" class="btn btn-ghost btn-sm">← 一覧</a>
    <div class="header-title">危険予知活動表（RKY）</div>
    <button class="btn btn-ghost btn-sm" id="pdf-btn" onclick="exportPdf()" style="display:none;">PDF</button>
  </div>
</div>

<div class="ky-wrap">
  <div class="card">
    <div class="field"><label>工事名</label><input type="text" id="f-site" disabled></div>
    <div class="field"><label>日付</label><input type="date" id="f-date"></div>
    <div class="field"><label>作業内容</label><textarea id="f-work" rows="2"></textarea></div>
    <div class="field"><label>大西熱学からの指示事項（安全・作業）</label><textarea id="f-inst" rows="2"></textarea></div>
    <div class="field"><label>本日の行動目標</label><input type="text" id="f-goal"></div>
    <div class="field"><label>会社名（グループ名）</label><input type="text" id="f-company"></div>
  </div>

  <div class="card">
    <h2>危険性の評価と対策</h2>
    <div class="hint" style="margin-bottom:10px;">可能性・重大性を選ぶと危険度（1〜5）が自動で出ます。最低3項目以上。</div>
    <div id="hazards"></div>
    <button class="addbtn" onclick="addHazard()">＋ 危険ポイントを追加</button>
  </div>

  <div class="card">
    <h2>本日の有資格作業及び作業者</h2>
    <div id="quals"></div>
    <button class="addbtn" onclick="addQual()">＋ 行を追加</button>
  </div>

  <div class="card">
    <h2>作業員（サイン）</h2>
    <div class="hint" style="margin-bottom:10px;">全員が自筆でフルネーム署名してください。</div>
    <div id="workers"></div>
    <button class="addbtn" onclick="addWorker()">＋ 作業員を追加</button>
  </div>

  <div class="card">
    <div class="field"><label>確認欄（確認者）</label><input type="text" id="f-confirmer"></div>
  </div>

  <button class="btn btn-primary" style="width:100%; padding:14px; font-size:16px;" onclick="save()">保存する</button>
</div>

<div class="modal" id="sig-modal">
  <div class="modal-box">
    <div style="font-weight:700; margin-bottom:8px;">署名</div>
    <canvas id="sig-canvas"></canvas>
    <div style="display:flex; gap:8px; margin-top:12px;">
      <button class="btn btn-ghost" style="flex:1;" onclick="clearSig()">クリア</button>
      <button class="btn btn-secondary" style="flex:1;" onclick="closeSig()">閉じる</button>
      <button class="btn btn-primary" style="flex:1;" onclick="saveSig()">確定</button>
    </div>
  </div>
</div>

<div id="page-loading" style="display:none;position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:9998;align-items:center;justify-content:center;"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/signature.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="js/pdf.js"></script>
<script>
if (!Auth.requireAuth()) { /* redirect */ }

const SYM = { '○': 1, '△': 2, '×': 3 };
const JUDGE = { 5: '即座に対策', 4: '抜本的対策', 3: '何らかの対策', 2: '注意を要する', 1: '現時点では対策不要', 0: '' };
function calcLevel(p, s) { if (!p || !s) return 0; return (SYM[p] || 0) + (SYM[s] || 0) - 1; }

let ky = null;
let currentSite = null;
let sigPad = null, sigTargetIdx = -1;

async function init() {
  App.loading(true);
  try {
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    currentSite = await Storage.getActiveSite();
    if (id) {
      ky = await Storage.getKy(id);
      if (!ky) { App.toast('KYが見つかりません', 'danger'); location.href = 'ky.html'; return; }
      document.getElementById('pdf-btn').style.display = '';
    } else {
      if (!currentSite) { App.toast('先に現場を選択してください', 'warning'); location.href = 'ky.html'; return; }
      ky = {
        id: Storage.uuid(),
        siteNumber: currentSite.number,
        siteName: currentSite.name,
        date: App.today(),
        workContent: '', instructions: '', actionGoal: '', companyName: '',
        hazards: [newHazard(), newHazard(), newHazard()],
        quals: [{ qual: '', worker: '' }, { qual: '', worker: '' }, { qual: '', worker: '' }],
        workers: [],
        confirmer: ''
      };
    }
    fillForm();
  } catch (e) { App.handleError(e, '読み込みに失敗しました'); }
  finally { App.loading(false); }
}

function newHazard() { return { hazard: '', possibility: '', severity: '', measure: '', possibilityAfter: '', severityAfter: '' }; }

function fillForm() {
  document.getElementById('f-site').value = '【' + (ky.siteNumber || '') + '】' + (ky.siteName || '');
  document.getElementById('f-date').value = ky.date || App.today();
  document.getElementById('f-work').value = ky.workContent || '';
  document.getElementById('f-inst').value = ky.instructions || '';
  document.getElementById('f-goal').value = ky.actionGoal || '';
  document.getElementById('f-company').value = ky.companyName || '';
  document.getElementById('f-confirmer').value = ky.confirmer || '';
  renderHazards(); renderQuals(); renderWorkers();
}

function opt(sel, cur) { return ['', '○', '△', '×'].map(v => `<option value="${v}" ${v === cur ? 'selected' : ''}>${v || '―'}</option>`).join(''); }

function renderHazards() {
  document.getElementById('hazards').innerHTML = ky.hazards.map((h, i) => {
    const lv = calcLevel(h.possibility, h.severity);
    const lvA = calcLevel(h.possibilityAfter, h.severityAfter);
    return `
    <div class="hz">
      <div class="hz-head"><span class="hz-no">No.${i + 1}</span>
        <button class="btn btn-ghost btn-sm" style="color:#dc2626" onclick="delHazard(${i})">削除</button></div>
      <div class="field"><label>予測される危険性・有害性（～して ～する）</label>
        <textarea rows="2" oninput="upd(${i},'hazard',this.value)">${App.escHtml(h.hazard)}</textarea></div>
      <div class="ps-row">
        <div class="field"><label>可能性</label><select onchange="upd(${i},'possibility',this.value);renderHazards()">${opt('p', h.possibility)}</select></div>
        <div class="field"><label>重大性</label><select onchange="upd(${i},'severity',this.value);renderHazards()">${opt('s', h.severity)}</select></div>
        <span class="risk-badge r${lv}">危険度 ${lv || '―'}<br><span style="font-weight:400;font-size:10px;">${JUDGE[lv]}</span></span>
      </div>
      <div class="field" style="margin-top:8px;"><label>対策（否定語はさける）</label>
        <textarea rows="2" oninput="upd(${i},'measure',this.value)">${App.escHtml(h.measure)}</textarea></div>
      <div class="ps-row">
        <div class="field"><label>対策後 可能性</label><select onchange="upd(${i},'possibilityAfter',this.value);renderHazards()">${opt('pa', h.possibilityAfter)}</select></div>
        <div class="field"><label>対策後 重大性</label><select onchange="upd(${i},'severityAfter',this.value);renderHazards()">${opt('sa', h.severityAfter)}</select></div>
        <span class="risk-badge r${lvA}">対策後 ${lvA || '―'}</span>
      </div>
    </div>`;
  }).join('');
}
function upd(i, k, v) { ky.hazards[i][k] = v; }
function addHazard() { ky.hazards.push(newHazard()); renderHazards(); }
function delHazard(i) { ky.hazards.splice(i, 1); renderHazards(); }

function renderQuals() {
  document.getElementById('quals').innerHTML = ky.quals.map((q, i) => `
    <div class="q-row">
      <div class="field"><input type="text" placeholder="資格作業" value="${App.escHtml(q.qual)}" oninput="ky.quals[${i}].qual=this.value"></div>
      <div class="field"><input type="text" placeholder="作業者" value="${App.escHtml(q.worker)}" oninput="ky.quals[${i}].worker=this.value"></div>
    </div>`).join('');
}
function addQual() { ky.quals.push({ qual: '', worker: '' }); renderQuals(); }

function renderWorkers() {
  document.getElementById('workers').innerHTML = ky.workers.map((w, i) => `
    <div class="worker">
      <input type="text" placeholder="氏名（フルネーム）" value="${App.escHtml(w.name)}" oninput="ky.workers[${i}].name=this.value">
      ${w.signature ? `<img src="${w.signature}" class="sig-prev">` : `<div class="sig-ph">未署名</div>`}
      <button class="btn btn-outline btn-sm" onclick="openSig(${i})">署名</button>
      <button class="btn btn-ghost btn-sm" style="color:#dc2626" onclick="ky.workers.splice(${i},1);renderWorkers()">✕</button>
    </div>`).join('');
}
function addWorker() { ky.workers.push({ name: '', signature: null }); renderWorkers(); }

// 署名モーダル
function openSig(i) {
  sigTargetIdx = i;
  document.getElementById('sig-modal').style.display = 'flex';
  if (!sigPad) sigPad = new SignaturePad(document.getElementById('sig-canvas'), { lineWidth: 3 });
  sigPad.clear();
  if (ky.workers[i].signature) sigPad.fromDataURL(ky.workers[i].signature);
}
function clearSig() { if (sigPad) sigPad.clear(); }
function closeSig() { document.getElementById('sig-modal').style.display = 'none'; }
function saveSig() {
  if (sigTargetIdx >= 0 && sigPad) ky.workers[sigTargetIdx].signature = sigPad.toDataURL();
  closeSig(); renderWorkers();
}

function collect() {
  ky.date = document.getElementById('f-date').value || App.today();
  ky.workContent = document.getElementById('f-work').value;
  ky.instructions = document.getElementById('f-inst').value;
  ky.actionGoal = document.getElementById('f-goal').value;
  ky.companyName = document.getElementById('f-company').value;
  ky.confirmer = document.getElementById('f-confirmer').value;
  ky.hazards.forEach(h => { h.level = calcLevel(h.possibility, h.severity); h.levelAfter = calcLevel(h.possibilityAfter, h.severityAfter); h.judge = JUDGE[h.level]; });
}

async function save() {
  collect();
  App.loading(true);
  try {
    await Storage.saveKy(ky);
    App.toast('保存しました');
    document.getElementById('pdf-btn').style.display = '';
    setTimeout(() => location.href = 'ky.html', 600);
  } catch (e) { App.handleError(e, '保存に失敗しました'); }
  finally { App.loading(false); }
}

async function exportPdf() {
  collect();
  App.loading(true);
  try { await PdfExport.generateKyPDF(ky); }
  catch (e) { App.handleError(e, 'PDF出力に失敗しました'); }
  finally { App.loading(false); }
}

init();
</script>
</body>
</html>
