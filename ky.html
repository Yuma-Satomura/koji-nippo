<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KY（危険予知活動表）</title>
<link rel="stylesheet" href="css/style.css">
<style>
.ky-wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
.site-banner { background:#eef2ff; border:1px solid #c7d2fe; color:#1e40af; border-radius:10px; padding:10px 14px; margin-bottom:14px; font-weight:700; font-size:14px; }
.card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:18px; margin-bottom:16px; }
.ky-item { display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:1px solid #f1f5f9; }
.ky-item:last-child { border-bottom:0; }
.ky-date { font-weight:700; }
.ky-sub { font-size:12px; color:#64748b; margin-top:2px; max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ky-actions { display:flex; gap:6px; align-items:center; }
.risk { font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; }
.r1,.r2 { background:#dcfce7; color:#15803d; }
.r3 { background:#fef9c3; color:#a16207; }
.r4,.r5 { background:#fee2e2; color:#b91c1c; }
.empty { text-align:center; color:#94a3b8; padding:24px; font-size:14px; }
</style>
</head>
<body>
<div class="app-header">
  <div class="header-inner">
    <a href="list.html" class="btn btn-ghost btn-sm">← 戻る</a>
    <div class="header-title">KY（危険予知活動表）</div>
    <span style="width:60px;"></span>
  </div>
</div>

<div class="ky-wrap">
  <div class="site-banner" id="site-banner">現場を読み込み中…</div>

  <div id="no-site" style="display:none;">
    <div class="card"><div class="empty">
      先に現場を選択してください。<br><br>
      <a href="genba.html" class="btn btn-primary btn-sm">現場管理へ</a>
    </div></div>
  </div>

  <div id="ky-ui" style="display:none;">
    <div class="card">
      <h2 style="font-size:15px; margin:0 0 10px; color:#1e40af;">大西熱学からの指示事項（安全・作業）</h2>
      <div style="font-size:12px; color:#64748b; margin-bottom:10px;">日付と業者を選んで前もって入力してください。KY作成時に反映されます。</div>
      <div style="margin-bottom:10px;">
        <label style="font-size:13px; font-weight:600; color:#334155; display:block; margin-bottom:5px;">日付</label>
        <input type="date" id="inst-date" onchange="onInstTargetChange()" style="width:100%; box-sizing:border-box; padding:9px 12px; font-size:15px; border:1.5px solid #cbd5e1; border-radius:9px;">
      </div>
      <label style="display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:10px; cursor:pointer;">
        <input type="checkbox" id="inst-all" onchange="onInstAllToggle()" style="width:18px; height:18px;"> すべての業者に適用
      </label>
      <div style="margin-bottom:10px;" id="inst-vendor-wrap">
        <label style="font-size:13px; font-weight:600; color:#334155; display:block; margin-bottom:5px;">業者</label>
        <select id="inst-vendor" onchange="onInstTargetChange()" style="width:100%; box-sizing:border-box; padding:9px 12px; font-size:15px; border:1.5px solid #cbd5e1; border-radius:9px;"></select>
      </div>
      <textarea id="inst-text" rows="3" placeholder="指示事項を入力" style="width:100%; box-sizing:border-box; padding:10px 12px; font-size:15px; border:1.5px solid #cbd5e1; border-radius:9px;"></textarea>
      <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="saveInst()">指示事項を保存</button>
      <div id="inst-current" style="margin-top:14px;"></div>
    </div>
    <div class="card" style="background:#eef2ff; border-color:#c7d2fe;">
      <div style="font-size:13px; color:#1e40af;">KYは現場のQRから、業者ごとに職長が記入し作業員が署名します。ここでは閲覧とPDF出力ができます。</div>
    </div>
    <div class="card">
      <h2 style="font-size:15px; margin:0 0 12px; color:#1e40af;">この現場のKY記録</h2>
      <div id="ky-list"><div class="empty">読み込み中…</div></div>
    </div>
  </div>
</div>

<div id="page-loading" style="display:none;position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:9998;align-items:center;justify-content:center;"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="js/pdf.js"></script>
<script>
if (!Auth.requireAuth()) { /* redirect */ }
let currentSite = null;
let kyRows = [];

async function init() {
  App.loading(true);
  try {
    currentSite = await Storage.getActiveSite();
    if (!currentSite) {
      document.getElementById('site-banner').style.display = 'none';
      document.getElementById('no-site').style.display = '';
      return;
    }
    document.getElementById('site-banner').textContent =
      '現場：【' + currentSite.number + '】' + currentSite.name;
    document.getElementById('ky-ui').style.display = '';
    instVendors = await Storage.getVendors(currentSite.number);
    const vsel = document.getElementById('inst-vendor');
    vsel.innerHTML = instVendors.map(v => `<option value="${v.id}">${App.escHtml(v.name)}</option>`).join('')
      || '<option value="">（業者未登録）</option>';
    document.getElementById('inst-date').value = App.today();
    await onInstTargetChange();
    await render();
  } catch (e) { App.handleError(e, '読み込みに失敗しました'); }
  finally { App.loading(false); }
}

function maxRisk(d) {
  const rows = (d.hazards || []);
  return rows.reduce((m, r) => Math.max(m, parseInt(r.level) || 0), 0);
}

async function render() {
  kyRows = await Storage.getKyList(currentSite.number);
  const el = document.getElementById('ky-list');
  if (!kyRows.length) { el.innerHTML = '<div class="empty">まだKY記録がありません</div>'; return; }
  el.innerHTML = kyRows.map((row, i) => {
    const d = row.data || {};
    const r = maxRisk(d);
    const signs = (d.workers || []).length;
    return `
    <div class="ky-item">
      <div style="min-width:0;">
        <div class="ky-date">${App.escHtml(row.date)} ${App.escHtml(d.vendorName || '')} ${r ? `<span class="risk r${r}">最大危険度 ${r}</span>` : ''}</div>
        <div class="ky-sub">${App.escHtml(d.workContent || '（作業内容未記入）')}　署名${signs}名</div>
      </div>
      <div class="ky-actions">
        <button class="btn btn-ghost btn-sm" onclick="pdf(${i})">PDF</button>
        <button class="btn btn-ghost btn-sm" style="color:#dc2626" onclick="del('${row.id}','${App.escHtml(row.date)}')">削除</button>
      </div>
    </div>`;
  }).join('');
}

let instVendors = [];
function instTarget() {
  return document.getElementById('inst-all').checked ? Storage.KY_ALL : document.getElementById('inst-vendor').value;
}
function onInstAllToggle() {
  document.getElementById('inst-vendor-wrap').style.display =
    document.getElementById('inst-all').checked ? 'none' : '';
  onInstTargetChange();
}
// 日付/業者を切り替えたら、その対象の既存指示を読み込む＋一覧を更新
async function onInstTargetChange() {
  const date = document.getElementById('inst-date').value;
  const target = instTarget();
  const rows = await Storage.getKyInstructionsForDate(currentSite.number, date);
  const hit = rows.find(r => r.vendor_id === target);
  document.getElementById('inst-text').value = hit ? hit.instructions : '';
  renderInstCurrent(rows, date);
}
function vendorLabel(vid) {
  if (vid === Storage.KY_ALL) return '全業者';
  const v = instVendors.find(x => x.id === vid);
  return v ? v.name : vid;
}
function renderInstCurrent(rows, date) {
  const el = document.getElementById('inst-current');
  if (!rows.length) { el.innerHTML = '<div style="font-size:12px;color:#94a3b8;">この日付の指示はまだありません</div>'; return; }
  el.innerHTML = '<div style="font-size:12px;color:#64748b;margin-bottom:6px;">' + App.escHtml(date) + ' の設定</div>'
    + rows.map(r => `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px solid #f1f5f9;font-size:13px;">
        <div><b>${App.escHtml(vendorLabel(r.vendor_id))}</b>：${App.escHtml(r.instructions)}</div>
        <button class="btn btn-ghost btn-sm" style="color:#dc2626;flex-shrink:0;" onclick="delInst('${App.escHtml(r.vendor_id)}')">削除</button>
      </div>`).join('');
}
async function saveInst() {
  const date = document.getElementById('inst-date').value;
  if (!date) { App.toast('日付を選んでください', 'warning'); return; }
  App.loading(true);
  try {
    await Storage.saveKyInstruction(currentSite.number, date, instTarget(), document.getElementById('inst-text').value);
    App.toast('指示事項を保存しました');
    await onInstTargetChange();
  } catch (e) { App.handleError(e, '保存に失敗しました'); }
  finally { App.loading(false); }
}
async function delInst(vendorId) {
  const date = document.getElementById('inst-date').value;
  App.loading(true);
  try {
    await Storage.deleteKyInstruction(currentSite.number, date, vendorId);
    App.toast('削除しました');
    await onInstTargetChange();
  } catch (e) { App.handleError(e, '削除に失敗しました'); }
  finally { App.loading(false); }
}

async function pdf(i) {
  const row = kyRows[i]; if (!row) return;
  App.loading(true);
  try { await PdfExport.generateKyPDF(row.data || {}); }
  catch (e) { App.handleError(e, 'PDF出力に失敗しました'); }
  finally { App.loading(false); }
}

async function del(id, date) {
  if (!confirm(date + ' のKYを削除しますか？')) return;
  App.loading(true);
  try {
    await Storage.deleteKy(id, currentSite.number);
    App.toast('削除しました');
    await render();
  } catch (e) { App.handleError(e, '削除に失敗しました'); }
  finally { App.loading(false); }
}

init();
</script>
</body>
</html>
