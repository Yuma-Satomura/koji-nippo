<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KY（危険予知活動表）</title>
<link rel="stylesheet" href="css/style.css">
<style>
.ky-wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
.site-banner { background:#eef2ff; border:1px solid #c7d2fe; color:#1e40af; border-radius:10px; padding:10px 14px; margin-bottom:14px; font-weight:700; font-size:14px; }
.card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:18px; margin-bottom:16px; }
.ky-item { display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:1px solid #f1f5f9; }
.ky-item:last-child { border-bottom:0; }
.ky-date { font-weight:700; }
.ky-sub { font-size:12px; color:#64748b; margin-top:2px; max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ky-actions { display:flex; gap:6px; align-items:center; }
.risk { font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; }
.r1,.r2 { background:#dcfce7; color:#15803d; }
.r3 { background:#fef9c3; color:#a16207; }
.r4,.r5 { background:#fee2e2; color:#b91c1c; }
.empty { text-align:center; color:#94a3b8; padding:24px; font-size:14px; }
</style>
</head>
<body>
<div class="app-header">
  <div class="header-inner">
    <a href="list.html" class="btn btn-ghost btn-sm">← 戻る</a>
    <div class="header-title">KY（危険予知活動表）</div>
    <span style="width:60px;"></span>
  </div>
</div>

<div class="ky-wrap">
  <div class="site-banner" id="site-banner">現場を読み込み中…</div>

  <div id="no-site" style="display:none;">
    <div class="card"><div class="empty">
      先に現場を選択してください。<br><br>
      <a href="genba.html" class="btn btn-primary btn-sm">現場管理へ</a>
    </div></div>
  </div>

  <div id="ky-ui" style="display:none;">
    <button class="btn btn-primary" style="width:100%; margin-bottom:14px;" onclick="createNew()">＋ 新しいKYを作成</button>
    <div class="card">
      <h2 style="font-size:15px; margin:0 0 12px; color:#1e40af;">この現場のKY記録</h2>
      <div id="ky-list"><div class="empty">読み込み中…</div></div>
    </div>
  </div>
</div>

<div id="page-loading" style="display:none;position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:9998;align-items:center;justify-content:center;"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
if (!Auth.requireAuth()) { /* redirect */ }
let currentSite = null;

async function init() {
  App.loading(true);
  try {
    currentSite = await Storage.getActiveSite();
    if (!currentSite) {
      document.getElementById('site-banner').style.display = 'none';
      document.getElementById('no-site').style.display = '';
      return;
    }
    document.getElementById('site-banner').textContent =
      '現場：【' + currentSite.number + '】' + currentSite.name;
    document.getElementById('ky-ui').style.display = '';
    await render();
  } catch (e) { App.handleError(e, '読み込みに失敗しました'); }
  finally { App.loading(false); }
}

function maxRisk(d) {
  const rows = (d.hazards || []);
  return rows.reduce((m, r) => Math.max(m, parseInt(r.level) || 0), 0);
}

async function render() {
  const list = await Storage.getKyList(currentSite.number);
  const el = document.getElementById('ky-list');
  if (!list.length) { el.innerHTML = '<div class="empty">まだKY記録がありません</div>'; return; }
  el.innerHTML = list.map(row => {
    const d = row.data || {};
    const r = maxRisk(d);
    return `
    <div class="ky-item">
      <div style="min-width:0;">
        <div class="ky-date">${App.escHtml(row.date)} ${r ? `<span class="risk r${r}">最大危険度 ${r}</span>` : ''}</div>
        <div class="ky-sub">${App.escHtml(d.workContent || '（作業内容未記入）')}</div>
      </div>
      <div class="ky-actions">
        <a class="btn btn-ghost btn-sm" href="ky-edit.html?id=${encodeURIComponent(row.id)}">開く</a>
        <button class="btn btn-ghost btn-sm" style="color:#dc2626" onclick="del('${row.id}','${App.escHtml(row.date)}')">削除</button>
      </div>
    </div>`;
  }).join('');
}

function createNew() { location.href = 'ky-edit.html?new=1'; }

async function del(id, date) {
  if (!confirm(date + ' のKYを削除しますか？')) return;
  App.loading(true);
  try {
    await Storage.deleteKy(id, currentSite.number);
    App.toast('削除しました');
    await render();
  } catch (e) { App.handleError(e, '削除に失敗しました'); }
  finally { App.loading(false); }
}

init();
</script>
</body>
</html>
